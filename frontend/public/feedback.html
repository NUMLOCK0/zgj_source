<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>线索异常快速反馈</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .feedback-card {
      background: #ffffff;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #f1f5f9;
    }
    .head-title {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .head-sub {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 16px;
    }
    .info-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .info-row { display: flex; }
    .info-lbl { width: 70px; color: #64748b; }
    .info-val { font-weight: 600; color: #1e293b; flex: 1; }

    .form-group { margin-bottom: 16px; }
    .form-lbl {
      font-size: 13.5px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
      display: block;
    }
    .reason-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .reason-btn {
      padding: 10px 8px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .reason-btn.active {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1d4ed8;
      font-weight: 700;
    }
    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13.5px;
      background: #f8fafc;
      outline: none;
    }
    .form-input:focus { border-color: #3b82f6; background: #fff; }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
    }
    .btn-submit:active { transform: scale(0.98); }
    .success-panel {
      text-align: center;
      padding: 30px 10px;
      display: none;
    }
    .success-icon { font-size: 48px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="feedback-card">
    <div id="form-container">
      <div class="head-title">⚠️ 线索异常反馈</div>
      <div class="head-sub">若线索联系不上或加不上，请反馈给客服重新核实</div>

      <div class="info-box">
        <div class="info-row"><span class="info-lbl">客户姓名:</span><span class="info-val" id="cust-name">加载中...</span></div>
        <div class="info-row"><span class="info-lbl">联系电话:</span><span class="info-val" id="cust-phone">-</span></div>
        <div class="info-row"><span class="info-lbl">微信号码:</span><span class="info-val" id="cust-wechat">-</span></div>
      </div>

      <div class="form-group">
        <label class="form-lbl">选择异常原因 <span style="color:red">*</span></label>
        <div class="reason-grid">
          <div class="reason-btn active" data-reason="微信二维码已过期/无法识别">微信二维码失效/过期</div>
          <div class="reason-btn" data-reason="电话空号 / 停机 / 错号">电话空号 / 停机</div>
          <div class="reason-btn" data-reason="微信搜索不到 / 限制添加">微信搜不到/被限制</div>
          <div class="reason-btn" data-reason="加后被秒删 / 未通过">被秒删 / 未通过</div>
          <div class="reason-btn" data-reason="称未咨询 / 态度恶劣">称未咨询 / 拒聊</div>
          <div class="reason-btn" data-reason="同行恶意留资 / 竞品打听">同行恶意打听</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-lbl">补充详情说明 (选填)</label>
        <textarea id="feedback-detail" class="form-input" rows="2" placeholder="例如：打了2次空号 / 微信扫出来是个人已注销"></textarea>
      </div>

      <div class="form-group">
        <label class="form-lbl">反馈人 / 销售称呼</label>
        <input type="text" id="feedback-sales" class="form-input" placeholder="例如：销售组-李工" />
      </div>

      <button class="btn-submit" id="btn-submit-feedback">🚨 提交异常，通知客服重新核实</button>
    </div>

    <div class="success-panel" id="success-panel">
      <div class="success-icon">✅</div>
      <h3 style="font-size:18px; margin-bottom:8px; color:#0f172a;">反馈已成功提交！</h3>
      <p style="font-size:13.5px; color:#64748b; line-height:1.5;">系统已将该异常实时推送到客服工作台，客服将重新核对联系方式并给您重新推送。</p>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type') || 'zc';
    const id = urlParams.get('id');

    let selectedReason = '微信二维码已过期/无法识别';

    document.querySelectorAll('.reason-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.reason-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedReason = btn.dataset.reason;
      });
    });

    async function loadCustomer() {
      if (!id) return;
      try {
        const res = await fetch(`/api/public/customer-info?type=${type}&id=${id}`);
        if (res.ok) {
          const data = await res.json();
          const c = data.customer || {};
          document.getElementById('cust-name').textContent = c.companyName || c.name || '客户';
          document.getElementById('cust-phone').textContent = c.phone || '无';
          document.getElementById('cust-wechat').textContent = c.wechat || '无';
        }
      } catch (e) {
        console.error('加载客户信息失败:', e);
      }
    }

    document.getElementById('btn-submit-feedback').addEventListener('click', async () => {
      const detail = document.getElementById('feedback-detail').value.trim();
      const sales = document.getElementById('feedback-sales').value.trim() || '销售同事';

      try {
        const res = await fetch('/api/public/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type,
            id: parseInt(id),
            reason: selectedReason,
            detail,
            sales
          })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          document.getElementById('form-container').style.display = 'none';
          document.getElementById('success-panel').style.display = 'block';
        } else {
          alert('提交失败: ' + (data.error || '未知错误'));
        }
      } catch (e) {
        alert('提交异常: ' + e.message);
      }
    });

    loadCustomer();
  </script>
</body>
</html>
