    <script id="custom-tab-rotator">
      // 监听底部工作台菜单点击，实现循环轮转顶部Tab：全盘总览 -> 职称业务 -> 财税业务 -> 提成表 -> 全盘总览
      (function() {
        var lastClickTime = 0;
        document.addEventListener('click', function(e) {
          var tabItem = e.target.closest && e.target.closest('.app-mobile-tabbar .tabbar-item, .tabbar-item');
          if (!tabItem) return;
          
          var labelEl = tabItem.querySelector('.tabbar-label');
          var labelText = (labelEl ? labelEl.textContent : tabItem.textContent || '').trim();
          
          if (labelText.indexOf('工作台') !== -1) {
            var now = Date.now();
            if (now - lastClickTime < 250) return;
            lastClickTime = now;

            // 检查当前页面是否在工作台（查找顶部业务切换按钮）
            var segBtns = document.querySelectorAll('.scope-nav-segment-bar .scope-seg-btn');
            if (segBtns && segBtns.length > 0) {
              var activeIdx = -1;
              for (var i = 0; i < segBtns.length; i++) {
                if (segBtns[i].classList.contains('active')) {
                  activeIdx = i;
                  break;
                }
              }
              var nextIdx = (activeIdx + 1) % segBtns.length;
              if (segBtns[nextIdx]) {
                segBtns[nextIdx].click();
              }
            }
          }
        }, true); // 使用 capture 捕获阶段，防止被 Vue 的 stopPropagation 拦截
      })();
    </script>
